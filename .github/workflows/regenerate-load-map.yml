name: Regenerate MEP Load Map

on:
  push:
    paths:
      - 'MEP_equipment_schedule.csv'
      - 'Combination_Automotive_Diesel_Facility_Project/Python_Workflow/scripts/generate_load_map.py'
  pull_request:
    paths:
      - 'MEP_equipment_schedule.csv'
      - 'Combination_Automotive_Diesel_Facility_Project/Python_Workflow/scripts/generate_load_map.py'

jobs:
  regen:
    name: Regenerate Load Map
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-py312.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-py312.txt

      - name: Run load-map generator
        run: |
          python Combination_Automotive_Diesel_Facility_Project/Python_Workflow/scripts/generate_load_map.py

      - name: Upload generated images
        uses: actions/upload-artifact@v4
        with:
          name: mep-load-map
          path: |
            docs/MEP_load_map_electrical.png
            docs/MEP_load_map_electrical.thumb.png
      - name: Create draft release for PR (for embedded preview)
        if: github.event_name == 'pull_request'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: mep-loadmap-pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}
          release_name: "MEP load map — PR #${{ github.event.pull_request.number }} run ${{ github.run_id }}"
          draft: true
          prerelease: false
          body: Generated by CI

      - name: Upload PNG to release
        if: github.event_name == 'pull_request'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: docs/MEP_load_map_electrical.png
          asset_name: MEP_load_map_electrical.png
          asset_content_type: image/png

      - name: Upload thumbnail to release
        if: github.event_name == 'pull_request'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: docs/MEP_load_map_electrical.thumb.png
          asset_name: MEP_load_map_electrical.thumb.png
          asset_content_type: image/png

      - name: Comment on PR with embedded image preview
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v2
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            :gear: The electrical load map was regenerated by CI and uploaded as release assets. Preview below:

            ![MEP load map](https://github.com/${{ github.repository }}/releases/download/mep-loadmap-pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}/MEP_load_map_electrical.png)

            Artifacts are also attached to the workflow run (artifact name: `mep-load-map`).
